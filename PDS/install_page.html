<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Em desenvolvimento | Zela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --text-base: 1rem;
            --text-lg: 1.25rem;
            --text-2xl: clamp(2.5rem, 8vw, 5rem);
            --space-4: 1rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-12: 3rem;
            --color-bg: #fffbfd;
            --color-surface: #fff4f8;
            --color-border: rgba(69, 2, 24, 0.12);
            --color-text: #450218;
            --color-text-muted: #6a1a32;
            --color-primary: #57021e;
            --color-text-inverse: #fff8fb;
            --shadow-lg: 0 24px 64px rgba(87, 2, 30, 0.16);
            --radius-xl: 1.75rem;
            --radius-full: 9999px;
            --font-display: "Cormorant Garamond", Georgia, serif;
            --font-body: Manrope, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: var(--space-8);
            font-family: var(--font-body);
            background:
                radial-gradient(circle at top right, rgba(244, 108, 136, 0.16), transparent 28%),
                radial-gradient(circle at bottom left, rgba(235, 168, 193, 0.18), transparent 26%),
                var(--color-bg);
            color: var(--color-text);
        }

        .dev-card {
            width: min(100%, 560px);
            padding: clamp(var(--space-8), 6vw, var(--space-12));
            border-radius: 32px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-lg);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            line-height: 0.95;
            letter-spacing: -0.02em;
        }

        p {
            margin-top: var(--space-4);
            font-size: var(--text-lg);
            color: var(--color-text-muted);
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            margin-top: var(--space-8);
            padding: 0 1.25rem;
            border-radius: var(--radius-full);
            background: var(--color-primary);
            color: var(--color-text-inverse);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main class="dev-card">
        <h1>Em desenvolvimento</h1>
        <p>Estamos preparando essa experiência para você.</p>
        <a href="./land_page.html">Voltar ao site</a>
    </main>
</body>

</html>
