<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zela Pixel Perfect</title>
    <style>
        :root {
            --bg: #efefef;
            --frame-top: #744e5e;
            --frame-bottom: #633d4c;
            --frame-edge: #d3bda9;
            --screen: #eadce3;
            --screen-soft: #faf6f7;
            --search: #fbfafb;
            --primary: #8a2149;
            --primary-text: #fff8fa;
            --text: #712846;
            --muted: #9d697b;
            --muted-light: #d1bcc5;
            --tile-bg: #fbf9fa;
            --tile-icon: #ebb8c7;
            --nav: #b8a0aa;
            --nav-active: #5f223e;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
            background: var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .stage {
            padding: 0;
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .phone {
            position: relative;
            width: 330px;
            height: 662px;
            border-radius: 39px;
            background: linear-gradient(180deg, var(--frame-top) 0%, var(--frame-bottom) 100%);
            border: 2px solid var(--frame-edge);
            box-shadow: 0 12px 24px rgba(78, 44, 58, 0.16);
            padding: 13px;
            overflow: hidden;
        }

        .side-btn,
        .side-btn-r1,
        .side-btn-r2 {
            position: absolute;
            width: 4px;
            background: #e9d9ca;
            border-radius: 999px;
            opacity: 0.95;
        }

        .side-btn { left: -2px; top: 153px; height: 56px; }
        .side-btn-r1 { right: -2px; top: 192px; height: 73px; }
        .side-btn-r2 { right: -2px; top: 276px; height: 73px; }

        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 31px;
            background: var(--screen);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 129px;
            height: 26px;
            background: #623b4b;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            z-index: 3;
        }

        .speaker { width: 45px; height: 6px; border-radius: 999px; background: #7e6872; }
        .camera { width: 8px; height: 8px; border-radius: 50%; background: #7e6872; }

        .status {
            height: 31px;
            padding: 14px 18px 0 19px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.63);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: -0.01em;
            position: relative;
            z-index: 2;
        }

        .status-right { display: flex; align-items: center; gap: 6px; }
        .signal { display: flex; gap: 1.5px; align-items: flex-end; height: 10px; }
        .signal span { display: block; width: 2px; background: rgba(255, 255, 255, 0.68); border-radius: 2px; }
        .signal span:nth-child(1) { height: 3px; }
        .signal span:nth-child(2) { height: 5px; }
        .signal span:nth-child(3) { height: 7px; }
        .signal span:nth-child(4) { height: 9px; }

        .battery {
            width: 18px;
            height: 10px;
            border: 1.2px solid rgba(255, 255, 255, 0.68);
            border-radius: 3px;
            position: relative;
        }

        .battery::before {
            content: "";
            position: absolute;
            left: 1px;
            top: 1px;
            width: 11px;
            height: 6px;
            border-radius: 1.5px;
            background: rgba(255, 255, 255, 0.68);
        }

        .battery::after {
            content: "";
            position: absolute;
            right: -2.6px;
            top: 2.4px;
            width: 1.8px;
            height: 4px;
            border-radius: 1px;
            background: rgba(255, 255, 255, 0.68);
        }

        .content {
            flex: 1;
            padding: 47px 17px 10px 17px;
            overflow: hidden;
        }

        .title {
            margin: 0;
            color: var(--text);
            font-weight: 800;
            font-size: 16px;
            line-height: 1.05;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 6px 0 16px;
            color: var(--muted);
            font-size: 11.4px;
            font-weight: 500;
            line-height: 1.15;
        }

        .search {
            height: 37px;
            border-radius: 999px;
            background: var(--search);
            color: var(--muted-light);
            display: flex;
            align-items: center;
            padding: 0 13px;
            font-size: 10.6px;
            font-weight: 500;
            margin-bottom: 19px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
        }

        .hero {
            min-height: 90px;
            background: var(--primary);
            border-radius: 18px;
            padding: 18px 16px 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 31px;
        }

        .hero h2 {
            margin: 0 0 4px;
            color: var(--primary-text);
            font-size: 14px;
            font-weight: 800;
            line-height: 1.18;
            letter-spacing: -0.02em;
            max-width: 178px;
        }

        .hero p {
            margin: 0;
            color: rgba(255, 255, 255, 0.73);
            font-size: 10.2px;
            font-weight: 500;
            line-height: 1.15;
        }

        .hero-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            display: grid;
            place-items: center;
            flex: 0 0 40px;
            margin-right: 2px;
        }

        .section-title {
            margin: 0 0 13px;
            color: var(--text);
            font-size: 13.6px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .card {
            min-height: 96px;
            border-radius: 18px;
            background: var(--tile-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 9px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.36);
        }

        .circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--tile-icon);
            display: grid;
            place-items: center;
        }

        .label {
            font-size: 10.8px;
            line-height: 1.15;
            font-weight: 700;
            color: #43313a;
            max-width: 96px;
            letter-spacing: -0.015em;
        }

        .bottom-nav {
            height: 56px;
            background: #fdfcfc;
            border-top: 1px solid rgba(113, 76, 95, 0.08);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 7px 7px 0;
            align-items: start;
            flex: 0 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--nav);
            font-size: 8.8px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .nav-item.active { color: var(--nav-active); }

        .home-indicator {
            position: absolute;
            left: 50%;
            bottom: 5px;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            border-radius: 999px;
            background: rgba(99, 72, 82, 0.26);
        }

        svg { display: block; }
    </style>
</head>

<body>
    <div class="stage">
        <div class="phone">
            <div class="side-btn"></div>
            <div class="side-btn-r1"></div>
            <div class="side-btn-r2"></div>

            <div class="screen">
                <div class="notch">
                    <div class="speaker"></div>
                    <div class="camera"></div>
                </div>

                <div class="status">
                    <div>18:20</div>
                    <div class="status-right">
                        <div class="signal"><span></span><span></span><span></span><span></span></div>
                        <div>5G</div>
                        <div class="battery"></div>
                    </div>
                </div>

                <div class="content">
                    <h1 class="title">Boa noite, Gaby 🌸</h1>
                    <p class="subtitle">Aqui você está segura. ❤️</p>
                    <div class="search">Buscar ajuda...</div>

                    <section class="hero">
                        <div>
                            <h2>Zela, o app que cuida de você</h2>
                            <p>Toque aqui para ver opções de ajuda</p>
                        </div>
                        <div class="hero-icon">
                            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M12 3.2 18 5.7v5.1c0 4-2.5 7.3-6 8.9-3.5-1.6-6-4.9-6-8.9V5.7l6-2.5Z" fill="#fff6f8" />
                                <path d="m9.4 12.1 1.7 1.8 3.6-4" stroke="#8a2149" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </div>
                    </section>

                    <section>
                        <h3 class="section-title">Acesso Rápido</h3>
                        <div class="grid">
                            <article class="card">
                                <div class="circle">
                                    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M8 10.8a2.9 2.9 0 1 0 0-5.8 2.9 2.9 0 0 0 0 5.8Zm8 0a2.9 2.9 0 1 0 0-5.8 2.9 2.9 0 0 0 0 5.8Z" fill="#8a2149" />
                                        <path d="M3.5 18.3c0-2.3 2.2-3.9 4.7-3.9 2.4 0 4.6 1.6 4.6 3.9v.5H3.5v-.5Zm7.4.5c.2-1.9 1.9-3.4 4.2-3.4 2.2 0 4.1 1.4 4.9 3.4h-9.1Z" fill="#8a2149" />
                                    </svg>
                                </div>
                                <div class="label">Contatos de Confiança</div>
                            </article>

                            <article class="card">
                                <div class="circle">
                                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M12 20.2S5.6 16.1 5.6 11.3c0-2 1.6-3.6 3.6-3.6 1.1 0 2.2.5 2.8 1.4.6-.9 1.7-1.4 2.8-1.4 2 0 3.6 1.6 3.6 3.6 0 4.8-6.4 8.9-6.4 8.9Z" fill="#8a2149" />
                                    </svg>
                                </div>
                                <div class="label">Rede de Apoio</div>
                            </article>
                        </div>
                    </section>

                    <section>
                        <h3 class="section-title">Navegar por categorias</h3>
                        <div class="grid">
                            <article class="card">
                                <div class="circle">
                                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M4.7 6.6c0-1 .8-1.8 1.8-1.8h4.2c.8 0 1.5.3 2 .7.5-.4 1.2-.7 2-.7h3.6c1 0 1.8.8 1.8 1.8v10.9c0 .4-.3.6-.7.4-1-.5-2-.7-3.1-.7H15c-.8 0-1.6.2-2.3.7-.7-.5-1.5-.7-2.3-.7H8c-1.1 0-2.2.2-3.1.7-.4.2-.7 0-.7-.4V6.6Z" stroke="#8a2149" stroke-width="1.55" />
                                        <path d="M12.6 5.2v11.5" stroke="#8a2149" stroke-width="1.55" />
                                    </svg>
                                </div>
                                <div class="label">Notícias</div>
                            </article>

                            <article class="card">
                                <div class="circle">
                                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                        <path d="M12 5.3c-3.6 0-6.5 2.4-6.5 5.5 0 1.7.8 3.1 2.2 4l-.7 2.9 2.7-1.5c.7.2 1.4.3 2.3.3 3.6 0 6.5-2.4 6.5-5.5S15.6 5.3 12 5.3Z" stroke="#8a2149" stroke-width="1.55" stroke-linejoin="round" />
                                    </svg>
                                </div>
                                <div class="label">Fórum</div>
                            </article>
                        </div>
                    </section>
                </div>

                <nav class="bottom-nav" aria-label="Menu inferior">
                    <div class="nav-item active">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M4.4 11.3 12 4.5l7.6 6.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M6.7 10.5V20h10.6v-9.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                        </svg>
                        <div>Home</div>
                    </div>

                    <div class="nav-item">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 5.3c-3.6 0-6.5 2.4-6.5 5.5 0 1.7.8 3.1 2.2 4l-.7 2.9 2.7-1.5c.7.2 1.4.3 2.3.3 3.6 0 6.5-2.4 6.5-5.5S15.6 5.3 12 5.3Z" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round" />
                        </svg>
                        <div>Fórum</div>
                    </div>

                    <div class="nav-item">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="12" r="8.5" fill="#dcaab8" />
                            <path d="M12 7.5v4.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
                            <circle cx="12" cy="15.8" r="0.95" fill="#fff" />
                        </svg>
                        <div>SOS</div>
                    </div>

                    <div class="nav-item">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M4.7 6.6c0-1 .8-1.8 1.8-1.8h4.2c.8 0 1.5.3 2 .7.5-.4 1.2-.7 2-.7h3.6c1 0 1.8.8 1.8 1.8v10.9c0 .4-.3.6-.7.4-1-.5-2-.7-3.1-.7H15c-.8 0-1.6.2-2.3.7-.7-.5-1.5-.7-2.3-.7H8c-1.1 0-2.2.2-3.1.7-.4.2-.7 0-.7-.4V6.6Z" stroke="currentColor" stroke-width="1.4" />
                            <path d="M12.6 5.2v11.5" stroke="currentColor" stroke-width="1.4" />
                        </svg>
                        <div>Educar</div>
                    </div>

                    <div class="nav-item">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle cx="12" cy="8" r="3.1" stroke="currentColor" stroke-width="1.45" />
                            <path d="M5.7 18.6c1.2-2.8 3.9-4.5 6.3-4.5s5.1 1.7 6.3 4.5" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" />
                        </svg>
                        <div>Perfil</div>
                    </div>
                </nav>

                <div class="home-indicator"></div>
            </div>
        </div>
    </div>
</body>
</html>
